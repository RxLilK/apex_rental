<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — APEX RENTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/script.js" defer></script>
</head>
<body>

<div id="site-header"></div>

<main class="section-sm">
    <div class="container" style="max-width:560px;">
        <h1 class="section-title">Support</h1>
        <p class="section-subtitle">Une question, une demande de réservation en tant que client standard, ou un souci avec ta location ? Écris-nous.</p>

        <div id="formSuccess" class="form-success hidden mt-3">Ton message a bien été envoyé. Un membre de l'équipe APEX RENTAL te répondra rapidement.</div>

        <form id="supportForm" class="mt-3">
            <div class="form-row">
                <div class="form-group">
                    <label for="nameField">Nom</label>
                    <input type="text" id="nameField" required>
                </div>
                <div class="form-group">
                    <label for="emailField">E-mail</label>
                    <input type="email" id="emailField" required>
                </div>
            </div>
            <div class="form-group">
                <label for="subjectField">Sujet</label>
                <input type="text" id="subjectField" required placeholder="ex : Réservation en tant que client standard">
            </div>
            <div class="form-group">
                <label for="messageField">Message</label>
                <textarea id="messageField" rows="5" required></textarea>
            </div>
            <div id="formError" class="form-error hidden mt-2"></div>
            <button type="submit" class="btn btn-primary btn-block">Envoyer</button>
        </form>
    </div>
</main>

<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    await initSupabaseSession();
    const user = getCurrentUser();
    if (user) {
        document.getElementById("nameField").value = (user.firstName || "") + " " + (user.lastName || "");
        document.getElementById("emailField").value = user.email || "";
    }

    document.getElementById("supportForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const errorBox = document.getElementById("formError");
        errorBox.classList.add("hidden");
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        const { error } = await supabaseClient.from("support_messages").insert({
            user_id: user ? user.id : null,
            name: document.getElementById("nameField").value,
            email: document.getElementById("emailField").value,
            subject: document.getElementById("subjectField").value,
            message: document.getElementById("messageField").value
        });

        submitBtn.disabled = false;

        if (error) {
            errorBox.textContent = "Une erreur est survenue, réessaie.";
            errorBox.classList.remove("hidden");
            return;
        }

        document.getElementById("supportForm").classList.add("hidden");
        document.getElementById("formSuccess").classList.remove("hidden");
    });
});
</script>

</body>
</html>

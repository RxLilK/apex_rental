<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — APEX RENTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/script.js" defer></script>
<style>
    .auth-wrap { min-height: calc(100vh - var(--header-height) - 220px); display:flex; align-items:center; justify-content:center; }
    .auth-card { max-width: 420px; width:100%; }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="section-sm auth-wrap">
    <div class="container">
        <div class="card auth-card" style="margin:0 auto;">
            <h1 class="section-title text-center" style="font-size:24px;">Connexion</h1>
            <p class="text-silver text-center mt-1" style="font-size:13px;">Accède à ton espace APEX RENTAL.</p>

            <div id="loginError" class="form-error hidden mt-3"></div>

            <form id="loginForm" class="mt-3">
                <div class="form-group">
                    <label for="loginEmail">Identifiant</label>
                    <input type="text" id="loginEmail" placeholder="prenom.nom ou e-mail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Se connecter</button>
            </form>

            <p class="text-silver text-center mt-3" style="font-size:12px;">
                Pas encore de compte ? <a href="inscription.html" id="registerLink" class="text-red">Créer un compte</a>
            </p>
            <p class="text-center mt-2">
                <a href="index.html" class="text-silver" style="font-size:11px; text-transform:uppercase; letter-spacing:.06em;">Retour à l'accueil</a>
            </p>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    if (redirect) {
        document.getElementById("registerLink").href = "inscription.html?redirect=" + encodeURIComponent(redirect);
    }

    // Si déjà connecté, redirige directement.
    await initSupabaseSession();
    const already = getCurrentUser();
    if (already) {
        navigateWithFade(redirect || (already.role === "admin" || already.role === "employee" ? "admin/dashboard.html" : "client/dashboard.html"));
        return;
    }

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const errorBox = document.getElementById("loginError");
        errorBox.classList.add("hidden");
        const submitBtn = document.getElementById("loginSubmit");
        submitBtn.disabled = true;
        submitBtn.textContent = "Connexion...";

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const result = await loginUser(email, password);

        if (!result.ok) {
            errorBox.textContent = result.error;
            errorBox.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "Se connecter";
            return;
        }

        const dest = redirect || (result.user.role === "admin" || result.user.role === "employee" ? "admin/dashboard.html" : "client/dashboard.html");
        navigateWithFade(dest);
    });
});
</script>

</body>
</html>

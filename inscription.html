<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — APEX RENTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/script.js" defer></script>
<style>
    .auth-card { max-width: 460px; width:100%; margin:0 auto; }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="section-sm">
    <div class="container">
        <div class="card auth-card">
            <h1 class="section-title text-center" style="font-size:24px;">Créer un compte</h1>
            <p class="text-silver text-center mt-1" style="font-size:13px;">Rejoins APEX RENTAL avec ton identité RP.</p>

            <div id="registerError" class="form-error hidden mt-3"></div>

            <form id="registerForm" class="mt-3">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Prénom</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Nom</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" placeholder="(xxx) xxx-xxxx" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">E-mail</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Mot de passe</label>
                    <input type="password" id="regPassword" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
            </form>

            <p class="text-silver text-center mt-3" style="font-size:12px;">
                Déjà un compte ? <a href="connexion.html" id="loginLink" class="text-red">Se connecter</a>
            </p>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    formatPhoneInput(document.getElementById("phone"));

    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    if (redirect) {
        document.getElementById("loginLink").href = "connexion.html?redirect=" + encodeURIComponent(redirect);
    }

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const errorBox = document.getElementById("registerError");
        errorBox.classList.add("hidden");
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Création...";

        const result = await registerUser({
            firstName: document.getElementById("firstName").value,
            lastName: document.getElementById("lastName").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("regEmail").value,
            password: document.getElementById("regPassword").value
        });

        if (!result.ok) {
            errorBox.textContent = result.error;
            errorBox.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "Créer mon compte";
            return;
        }

        navigateWithFade(redirect || "client/dashboard.html");
    });
});
</script>

</body>
</html>

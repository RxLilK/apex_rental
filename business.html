<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Business — APEX RENTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/script.js" defer></script>
</head>
<body>

<div id="site-header"></div>

<main>
    <section class="section-sm">
        <div class="container">
            <h1 class="section-title">Apex Business</h1>
            <p class="section-subtitle">Des solutions de location pensées pour les entreprises et flottes professionnelles RP.</p>
        </div>
    </section>

    <section class="section" style="padding-top:0;">
        <div class="container grid grid-2" id="businessFeatures" style="margin-bottom:56px;"></div>

        <div class="container" style="max-width:640px;">
            <h2 class="section-title" style="font-size:22px;">Demander un contrat Business</h2>
            <p class="section-subtitle mt-1">Renseigne les informations de ton entreprise RP, notre équipe te recontacte.</p>

            <div id="businessSuccess" class="form-success hidden mt-3">Ta demande a bien été enregistrée. L'équipe APEX BUSINESS te recontactera.</div>

            <form id="businessForm" class="mt-3">
                <div class="form-row">
                    <div class="form-group">
                        <label for="companyName">Nom de l'entreprise</label>
                        <input type="text" id="companyName" required>
                    </div>
                    <div class="form-group">
                        <label for="managerName">Nom du gestionnaire</label>
                        <input type="text" id="managerName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="bizEmail">E-mail de contact</label>
                        <input type="email" id="bizEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="fleetSize">Taille de flotte souhaitée</label>
                        <input type="number" id="fleetSize" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bizMessage">Détails de la demande</label>
                    <textarea id="bizMessage" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Demander un contrat Business</button>
            </form>
        </div>
    </section>
</main>

<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const features = [
        { icon: "🏢", title: "Compte entreprise", desc: "Un espace dédié à votre société avec plusieurs employés rattachés." },
        { icon: "🚘", title: "Flotte active", desc: "Gérez plusieurs véhicules et réservations multiples simultanément." },
        { icon: "🧾", title: "Facturation mensuelle", desc: "Un récapitulatif unique de toutes vos locations professionnelles." },
        { icon: "📈", title: "Tarifs préférentiels", desc: "Des conditions commerciales adaptées à votre volume de location." }
    ];

    document.getElementById("businessFeatures").innerHTML = features.map(function (f) {
        return (
            '<div class="card reveal">' +
            '  <div style="font-size:24px;">' + f.icon + '</div>' +
            '  <h3 class="mt-2" style="font-size:15px; color:var(--apex-white);">' + f.title + '</h3>' +
            '  <p class="text-silver mt-1" style="font-size:13px;">' + f.desc + '</p>' +
            '</div>'
        );
    }).join("");
    initScrollReveal();

    document.getElementById("businessForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        const result = await submitBusinessRequest({
            companyName: document.getElementById("companyName").value,
            managerName: document.getElementById("managerName").value,
            email: document.getElementById("bizEmail").value,
            fleetSize: parseInt(document.getElementById("fleetSize").value, 10) || 1,
            message: document.getElementById("bizMessage").value
        });

        submitBtn.disabled = false;
        if (!result.ok) {
            alert("Une erreur est survenue, réessaie.");
            return;
        }

        document.getElementById("businessForm").classList.add("hidden");
        document.getElementById("businessSuccess").classList.remove("hidden");
    });
});
</script>

</body>
</html>
